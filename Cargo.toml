[package]
name = "codex-quota"
version = "0.1.0"
edition = "2021"
description = "Check Codex quota from local session logs before starting work"
repository = "https://github.com/SebastienElet/codex-quota"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
